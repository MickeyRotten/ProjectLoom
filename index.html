<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch-zoom stays ENABLED. `maximum-scale=1.0, user-scalable=no` blocks the
      only way a reader can enlarge a wall of monospace prose, which is a WCAG
      1.4.4 failure in a text-first app. Settings → Text Size covers the common
      case; zoom is the escape hatch that must still exist.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#000000" />
    <title>Loom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
